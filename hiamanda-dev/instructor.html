<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Instructor View · horizon.dev</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Caveat:wght@600;700&family=Chakra+Petch:wght@500;600&family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,500&family=Fredoka:wght@500;600&family=JetBrains+Mono:wght@400;500;600&family=Julius+Sans+One&family=Sora:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/instructor.css">
</head>
<body>
  <header class="it-top">
    <span class="mark" aria-hidden="true"></span>
    <div class="it-brand">Instructor View</div>
    <label class="it-select">
      <span class="sr-only">Project</span>
      <select id="project-select"></select>
    </label>
    <div class="it-top-right">
      <button class="it-jump" id="jump" hidden></button>
      <button class="it-follow is-on" id="follow" aria-pressed="true" title="Keyboard: F">
        <span class="dot"></span><span id="follow-text">Following your workspace</span>
      </button>
      <div class="it-size" role="group" aria-label="Text size">
        <button id="size-down" aria-label="Smaller text">A−</button>
        <button id="size-up" aria-label="Bigger text">A+</button>
      </div>
    </div>
  </header>
  <div class="it-body">
    <nav class="it-rail" id="rail" aria-label="Steps"></nav>
    <main class="it-main" id="main" tabindex="-1"></main>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="js/projects.js"></script>
  <script src="js/talk.js"></script>
  <script src="js/worlds.js"></script>
  <script src="js/instructor.js"></script>
</body>
</html>
